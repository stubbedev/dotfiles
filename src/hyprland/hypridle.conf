general {
    lock_cmd = wayle-lock
    # Lock before logind suspends (hypridle holds a sleep delay-inhibitor),
    # so wake lands on the lock screen instead of flashing the session.
    before_sleep_cmd = loginctl lock-session
    # s2idle resume can leave DPMS off; force displays back on, and re-lock if
    # the lock client died across the sleep (see lock-recover).
    after_sleep_cmd = lock-recover resume
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screens off shortly after the lock lands — a locked but lit panel is
# pure battery drain. on-resume covers wiggle-the-mouse wakeups. dpms goes
# through lock-recover: `hyprctl dispatch dpms off` is a Lua parse error on
# the Lua config manager (Hyprland >= 0.53), i.e. a silent no-op.
listener {
    timeout = 330
    on-timeout = lock-recover screens-off
    on-resume = lock-recover screens-on
}

# macOS-style idle sleep, battery only. On AC (docked included) the
# machine stays up so SSH and long builds survive.
listener {
    timeout = 900
    on-timeout = sh -c 'grep -qx 1 /sys/class/power_supply/AC/online || systemctl suspend'
}


general {
    lock_cmd = wayle-lock
    # Lock before logind suspends (hypridle holds a sleep delay-inhibitor),
    # so wake lands on the lock screen instead of flashing the session.
    before_sleep_cmd = loginctl lock-session
    # s2idle resume can leave DPMS off; force displays back on.
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screens off shortly after the lock lands — a locked but lit panel is
# pure battery drain. on-resume covers wiggle-the-mouse wakeups.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# macOS-style idle sleep, battery only. On AC (docked included) the
# machine stays up so SSH and long builds survive.
listener {
    timeout = 900
    on-timeout = sh -c 'grep -qx 1 /sys/class/power_supply/AC/online || systemctl suspend'
}

